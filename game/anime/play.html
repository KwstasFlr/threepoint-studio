<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Anime — GuessPlex</title><meta name="description" content="Recognise famous anime characters from their shoes. Four choices, ten seconds per image."><link rel="canonical" href="https://guessplex.com/game/anime/"><link rel="icon" href="../../guessplex-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css?v=20261108-frames"></head>
<body><header><a class="brand" href="../">GUESSPLEX · ANIME</a><div class="languages" aria-label="Language"><button type="button" data-lang="en">English</button><button type="button" data-lang="el">Ελληνικά</button></div><a class="home" href="../" data-copy="back">← Back to home</a></header>
<main><a class="mode-back" href="./">← Anime</a><div class="title-row"><div><span class="eyebrow">ANIME · 10 SECONDS</span><h1 id="gameTitle">Guess the Character</h1></div><span class="round-pill" id="roundLabel"></span></div>
<section id="intro" class="intro"><div class="intro-visual" aria-hidden="true"><img src="media/frame-nami.png" alt=""><span>10<span>SEC</span></span></div><div><h2 data-copy="introTitle">Know the Character</h2><p data-copy="intro">Four names. Ten seconds per image. Find the character, then see the full picture.</p><button id="start" class="primary" type="button" data-copy="start">Play</button><p id="loadStatus" role="status" aria-live="polite"></p></div></section>
<section id="playing" hidden aria-labelledby="question"><div class="status-row"><span id="questionNumber"></span><span id="score"></span><span id="elapsed"></span></div><div class="question-row"><h2 id="question" tabindex="-1" data-copy="question">Who is this character?</h2><output id="timer" aria-label="Seconds remaining">10.0</output></div><div class="time-track" aria-hidden="true"><div id="timeBar"></div></div>
<div id="cropFrame" class="crop-frame"><img id="cropImage" alt="The hidden anime character’s shoes" draggable="false"></div>
<div id="answerReveal" class="answer-reveal" hidden role="status" aria-live="polite"><span id="answerState"></span><strong id="answerName"></strong><small id="answerSeries"></small></div>
<div id="answers" class="answers" role="group" aria-labelledby="question"></div>
<section id="fullReveal" hidden><img id="fullImage" alt=""><p id="imageCredit"></p><button id="next" class="primary" type="button" data-copy="next">Next image →</button></section></section>
<section id="result" class="result" hidden aria-labelledby="resultTitle"><span class="eyebrow" data-copy="finished">ROUND COMPLETE</span><h2 id="resultTitle" tabindex="-1"></h2><p id="summary"></p><p id="best"></p><p id="scoreStatus" role="status"></p><button id="again" class="primary" type="button" data-copy="again">Play again</button><ol id="reviewList"></ol></section>
</main><footer>GuessPlex <a href="credits.html" data-copy="credits">Image credits</a><a href="../../contact.html?service=bugs#projectForm" data-copy="report">Report an image</a></footer>
<script defer src="../CATEGORYSCORES.JS?v=20261105-anime"></script><script defer src="../PROGRESS.JS?v=20261026-sprint-time"></script><script type="module" src="app.mjs?v=20261108-frames"></script></body></html>
