<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>General Knowledge — GuessPlex</title><meta name="description" content="One minute. Four choices. Answer general knowledge questions against the clock, in English or Greek."><link rel="canonical" href="https://guessplex.com/game/knowledge/"><link rel="icon" href="../../guessplex-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="../painter/style.css"><link rel="stylesheet" href="../BACKBUTTONS.CSS?v=20261028-compact-v3"><link rel="stylesheet" href="style.css?v=20261017-sprint"></head>
<body><header><a class="brand" href="../">GuessPlex ✦</a><a class="gmp-back" href="../" data-copy="back">← All games</a><div class="languages" aria-label="Language"><button type="button" data-lang="en">English</button><button type="button" data-lang="el">Ελληνικά</button></div></header>
<main><span class="eyebrow" data-copy="eyebrow">THE ONE-MINUTE CHALLENGE</span><h1 data-copy="title">General Knowledge</h1>
<section class="panel quiz-panel" aria-labelledby="question"><div class="quiz-top"><div><span class="stat-label" data-copy="time">TIME LEFT</span><span id="timer" class="timer" role="timer" aria-live="off">1:00</span></div><div class="quiz-score"><span class="stat-label" data-copy="correct">CORRECT</span><strong id="score">0</strong></div></div><div class="time-track" aria-hidden="true"><div id="timeBar"></div></div>
<div id="intro"><p data-copy="intro">You have 60 seconds. Each correct answer opens the next question. One wrong answer ends the round.</p><button id="start" class="primary" type="button" data-copy="start">Start round</button></div>

<div id="playing" hidden><div class="question-meta"><span id="questionNumber"></span><span id="topic"></span></div><p id="lastAnswer" class="last-answer" role="status" aria-live="polite"></p><h2 id="question" tabindex="-1"></h2><div id="answers" class="answers" role="group" aria-labelledby="question"></div></div>
<section id="result" hidden aria-labelledby="resultTitle"><span class="result-kicker" data-copy="finished">TIME’S UP</span><h2 id="resultTitle" tabindex="-1"></h2><p id="summary"></p><p id="best"></p><p id="scoreStatus" role="status" aria-live="polite"></p><button id="retryScore" type="button" hidden>Retry saving score</button><button id="again" class="primary" type="button" data-copy="again">Play again</button><details id="review"><summary data-copy="review">Review your answers</summary><ol id="reviewList"></ol></details></section></section>
<p id="loadStatus" role="status"></p></main>
